<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --orange:   #f7931a;
      --green:    #3fb950;
      --red:      #f85149;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 40px; height: 40px;
      background: var(--orange);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 900; color: var(--bg);
    }
    .logo h1 { font-size: 1.25rem; font-weight: 700; }
    .logo h1 span { color: var(--orange); }

    .header-meta {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }
    #updated-at { font-size: 0.78rem; color: var(--muted); }

    /* ── REFRESH BUTTON ── */
    #refresh-btn {
      display: flex; align-items: center; gap: 8px;
      background: var(--orange);
      color: var(--bg);
      border: none; border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.9rem; font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    #refresh-btn:hover:not(:disabled) { background: #ffaa44; }
    #refresh-btn:active:not(:disabled) { transform: scale(.97); }
    #refresh-btn:disabled { opacity: .55; cursor: not-allowed; }

    .spin-icon { display: inline-block; transition: none; }
    .spin-icon.spinning { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── MAIN ── */
    main { max-width: 1120px; margin: 0 auto; padding: 32px 20px; }

    /* ── AVG CARD ── */
    .avg-card {
      background: var(--surface);
      border: 1px solid #f7931a55;
      border-radius: 14px;
      padding: 30px 24px;
      text-align: center;
      margin-bottom: 28px;
    }
    .avg-card .label {
      font-size: .75rem; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted); margin-bottom: 8px;
    }
    .avg-card .price {
      font-size: 3rem; font-weight: 800; color: var(--orange);
      letter-spacing: -.02em;
    }
    .avg-card .sub {
      margin-top: 6px; font-size: .82rem; color: var(--muted);
    }

    /* ── SOURCE CARDS ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      transition: border-color .2s;
    }
    .card:hover { border-color: #f7931a66; }

    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .source-name { font-size: 1rem; font-weight: 700; }

    .badge {
      font-size: .68rem; font-weight: 700;
      padding: 3px 9px; border-radius: 999px; letter-spacing: .04em;
    }
    .badge-live { background: #1a3a1a; color: var(--green); }
    .badge-err  { background: #3a1a1a; color: var(--red); }
    .badge-loading { background: #1e2a3a; color: #58a6ff; }

    .card-price {
      font-size: 2rem; font-weight: 800; letter-spacing: -.02em;
      margin-bottom: 4px;
    }
    .card-change { font-size: .9rem; font-weight: 600; margin-bottom: 18px; }
    .up   { color: var(--green); }
    .down { color: var(--red); }

    .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .stat {
      background: var(--bg); border-radius: 8px; padding: 10px 12px;
    }
    .stat-label {
      font-size: .68rem; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted); margin-bottom: 3px;
    }
    .stat-value { font-size: .88rem; font-weight: 600; }
    .stat.full { grid-column: span 2; }

    .card-error { color: var(--red); font-size: .84rem; margin-top: 6px; }

    /* ── ERROR BANNER ── */
    .error-banner {
      background: #3a1a1a; border: 1px solid var(--red);
      border-radius: 10px; padding: 14px 18px;
      color: var(--red); margin-bottom: 20px; display: none;
    }

    /* skeleton pulse */
    .skeleton {
      background: linear-gradient(90deg, #21262d 25%, #30363d 50%, #21262d 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px; height: 1em;
    }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">₿</div>
    <h1>Bitcoin <span>Dashboard</span></h1>
  </div>
  <div class="header-meta">
    <span id="updated-at">Nie zaktualizowano</span>
    <button id="refresh-btn" onclick="refresh()">
      <span class="spin-icon" id="spin">⟳</span>
      Odśwież dane
    </button>
  </div>
</header>

<main>
  <div id="error-banner" class="error-banner"></div>

  <div class="avg-card">
    <div class="label">Średnia cena BTC (3 źródła)</div>
    <div class="price" id="avg-price">—</div>
    <div class="sub" id="avg-sub">Kliknij „Odśwież dane" aby pobrać aktualne kursy</div>
  </div>

  <div class="cards" id="cards">
    <!-- wypełniane przez JS -->
  </div>
</main>

<script>
const SOURCES = [
  {
    name: "Binance",
    fetch: async () => {
      const r = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT");
      const d = await r.json();
      return {
        price:      +d.lastPrice,
        change24h:  +d.priceChangePercent,
        high24h:    +d.highPrice,
        low24h:     +d.lowPrice,
        volume24h:  +d.volume,       // w BTC
        volUnit:    "BTC",
      };
    },
  },
  {
    name: "Kraken",
    fetch: async () => {
      const r = await fetch("https://api.kraken.com/0/public/Ticker?pair=XBTUSD");
      const d = await r.json();
      const t = d.result.XXBTZUSD;
      const open = +t.o, last = +t.c[0];
      return {
        price:     last,
        change24h: +((last - open) / open * 100).toFixed(2),
        high24h:   +t.h[1],
        low24h:    +t.l[1],
        volume24h: +t.v[1],
        volUnit:   "BTC",
      };
    },
  },
  {
    name: "CoinGecko",
    fetch: async () => {
      const r = await fetch(
        "https://api.coingecko.com/api/v3/coins/bitcoin?localization=false&tickers=false&community_data=false&developer_data=false"
      );
      const d = await r.json();
      const m = d.market_data;
      return {
        price:     m.current_price.usd,
        change24h: +m.price_change_percentage_24h.toFixed(2),
        high24h:   m.high_24h.usd,
        low24h:    m.low_24h.usd,
        volume24h: m.total_volume.usd,
        volUnit:   "USD",
      };
    },
  },
];

// ── formatters ────────────────────────────────────────
const usd = v => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 2 }).format(v);
const pct = v => (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
function fmtVol(v, unit) {
  if (unit === "USD") {
    if (v >= 1e9) return "$" + (v / 1e9).toFixed(2) + "B";
    if (v >= 1e6) return "$" + (v / 1e6).toFixed(2) + "M";
    return "$" + v.toLocaleString();
  }
  if (v >= 1e6) return (v / 1e6).toFixed(2) + "M BTC";
  if (v >= 1e3) return (v / 1e3).toFixed(2) + "K BTC";
  return v.toFixed(2) + " BTC";
}

// ── skeleton cards (loading state) ───────────────────
function renderSkeleton() {
  document.getElementById("cards").innerHTML = SOURCES.map(s => `
    <div class="card">
      <div class="card-head">
        <span class="source-name">${s.name}</span>
        <span class="badge badge-loading">ŁADOWANIE</span>
      </div>
      <div class="skeleton" style="height:2rem;margin-bottom:8px"></div>
      <div class="skeleton" style="height:1rem;width:60%;margin-bottom:18px"></div>
      <div class="stats">
        <div class="stat"><div class="skeleton"></div></div>
        <div class="stat"><div class="skeleton"></div></div>
        <div class="stat full"><div class="skeleton"></div></div>
      </div>
    </div>`).join("");
}

// ── render one card ───────────────────────────────────
function renderCard(name, data, err) {
  if (err) return `
    <div class="card">
      <div class="card-head">
        <span class="source-name">${name}</span>
        <span class="badge badge-err">BŁĄD</span>
      </div>
      <div class="card-error">⚠ ${err}</div>
    </div>`;

  const dir = data.change24h >= 0 ? "up" : "down";
  return `
    <div class="card">
      <div class="card-head">
        <span class="source-name">${name}</span>
        <span class="badge badge-live">LIVE</span>
      </div>
      <div class="card-price">${usd(data.price)}</div>
      <div class="card-change ${dir}">${pct(data.change24h)} (24h)</div>
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Najwyższy 24h</div>
          <div class="stat-value">${usd(data.high24h)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Najniższy 24h</div>
          <div class="stat-value">${usd(data.low24h)}</div>
        </div>
        <div class="stat full">
          <div class="stat-label">Wolumen 24h</div>
          <div class="stat-value">${fmtVol(data.volume24h, data.volUnit)}</div>
        </div>
      </div>
    </div>`;
}

// ── main refresh ──────────────────────────────────────
async function refresh() {
  const btn  = document.getElementById("refresh-btn");
  const spin = document.getElementById("spin");
  const banner = document.getElementById("error-banner");

  btn.disabled = true;
  spin.classList.add("spinning");
  banner.style.display = "none";
  renderSkeleton();
  document.getElementById("avg-price").textContent = "…";

  const results = await Promise.allSettled(SOURCES.map(s => s.fetch()));

  const cards = [];
  const prices = [];

  results.forEach((res, i) => {
    const name = SOURCES[i].name;
    if (res.status === "fulfilled") {
      cards.push(renderCard(name, res.value, null));
      prices.push(res.value.price);
    } else {
      cards.push(renderCard(name, null, res.reason?.message ?? "Nieznany błąd"));
    }
  });

  document.getElementById("cards").innerHTML = cards.join("");

  if (prices.length > 0) {
    const avg = prices.reduce((a, b) => a + b, 0) / prices.length;
    document.getElementById("avg-price").textContent = usd(avg);
    document.getElementById("avg-sub").textContent =
      `Średnia z ${prices.length} źródeł · ostatnia aktualizacja: ${new Date().toLocaleTimeString("pl-PL")}`;
  } else {
    document.getElementById("avg-price").textContent = "—";
    banner.textContent = "Nie udało się pobrać danych z żadnego źródła.";
    banner.style.display = "block";
  }

  btn.disabled = false;
  spin.classList.remove("spinning");
}

// auto-load on start
refresh();
</script>
</body>
</html>
